[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-rlhf-ppo"
version = "1.0.0"
description = "Reinforcement Learning from Human Feedback with PPO algorithm"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "rlhf", "ppo", "reinforcement-learning", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-rlhf-ppo"
Repository = "https://github.com/ElNeMeR70/py-rlhf-ppo"
